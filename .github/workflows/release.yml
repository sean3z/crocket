name: Release

# Channels (see README "Versions and channels"):
#   latest:       every push to main        -> :latest, :sha-<short>
#   stable:       tag X.Y.Z                 -> :X.Y.Z, :X.Y, :stable + GitHub Release
#   experimental: tag X.Y.Z-rc.N            -> :X.Y.Z-rc.N, :experimental + pre-release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.t.outputs.tags }}
      version: ${{ steps.t.outputs.version }}
      channel: ${{ steps.t.outputs.channel }}
      short: ${{ steps.t.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        shell: bash
        run: |
          set -euo pipefail
          img=ghcr.io/${{ github.repository_owner }}/crocket-hello
          short=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v=$GITHUB_REF_NAME
            want=$(sed -n 's/^project(crocket VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            base=${v%%-*}
            if [[ "$base" != "$want" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project(crocket VERSION $want)"; exit 1
            fi
            if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              channel=stable
              tags="$img:$v,$img:${v%.*},$img:stable"
            elif [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              channel=experimental
              tags="$img:$v,$img:experimental"
            else
              echo "::error::unsupported tag $GITHUB_REF_NAME (use X.Y.Z or X.Y.Z-rc.N)"; exit 1
            fi
          else
            v=""; channel=latest
            tags="$img:latest,$img:sha-$short"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "channel=$channel tags=$tags"

  image:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hello.Dockerfile
          push: true
          build-args: CROCKET_GIT_COMMIT=${{ needs.meta.outputs.short }}
          tags: ${{ needs.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version || 'main' }}

  release:
    needs: [meta, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          v=${{ needs.meta.outputs.version }}
          # The "## [X.Y.Z]" section, up to the next "## [".
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$v]"; exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ needs.meta.outputs.channel }}" == experimental ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" --title "crocket $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
