name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Ubuntu 26.04 with the ./dev setup packages and GCC 16.2 already built
    # (docker/toolchain.Dockerfile, published by toolchain.yml).
    container:
      image: ghcr.io/sean3z/crocket-toolchain:gcc-16.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    # The db test (crocket::db on crocket::pg) runs against this Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crocket
          POSTGRES_PASSWORD: crocket
          POSTGRES_DB: crocket_test
        options: >-
          --health-cmd "pg_isready -U crocket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CROCKET_TEST_DATABASE_URL: postgresql://crocket:crocket@postgres:5432/crocket_test
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # libpqxx built here with GCC 16 in C++26, not the distro package: its ABI
      # depends on the compiler and C++ standard it was built with, and the
      # Ubuntu build crashes (double free) when mixed with crocket's.
      - name: Build libpqxx (crocket::pg)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -q --no-install-recommends libpq-dev
          curl -fsSL https://github.com/jtv/libpqxx/archive/refs/tags/7.10.0.tar.gz | tar xz -C /tmp
          cmake -S /tmp/libpqxx-7.10.0 -B /tmp/pqxx-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=$CROCKET_GCC_PREFIX/bin/g++-16.2 -DCMAKE_C_COMPILER=$CROCKET_GCC_PREFIX/bin/gcc-16.2 \
            -DCMAKE_CXX_STANDARD=26 -DSKIP_BUILD_TEST=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_DOC=OFF
          cmake --build /tmp/pqxx-build
          $SUDO cmake --install /tmp/pqxx-build

      - name: Release build and all tests
        run: ./dev check
