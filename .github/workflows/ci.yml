name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Ubuntu 26.04 with the ./dev setup packages and GCC 16.2 already built
    # (docker/toolchain.Dockerfile, published by toolchain.yml).
    container:
      image: ghcr.io/sean3z/crocket-toolchain:gcc-16.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    # The db test (crocket::db) runs against this Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crocket
          POSTGRES_PASSWORD: crocket
          POSTGRES_DB: crocket_test
        options: >-
          --health-cmd "pg_isready -U crocket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CROCKET_TEST_DATABASE_URL: postgresql://crocket:crocket@postgres:5432/crocket_test
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Install libpqxx (crocket::db)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -q --no-install-recommends libpqxx-dev

      - name: Release build and all tests
        run: ./dev check
